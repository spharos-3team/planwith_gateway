name: Deploy Gateway

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [closed]
    branches: [main, develop]
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: [self-hosted, planwith-server]
    defaults:
      run:
        shell: cmd

    env:
      IMAGE_NAME: planwith/gateway
      IMAGE_TAG: latest
      COMPOSE_FILE: C:/planwith/docker-compose.yml
      SERVICE_NAME: gateway

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Build Docker image
        shell: powershell
        run: |
          $image = "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          $ok = $false
          foreach ($n in 1..3) {
            Write-Host "docker build attempt $n"
            docker build -t $image .
            if ($LASTEXITCODE -eq 0) {
              $ok = $true
              break
            }
            Start-Sleep -Seconds 20
          }
          if (-not $ok) { exit 1 }

      - name: Stop and recreate service container
        run: |
          docker compose -f "%COMPOSE_FILE%" stop %SERVICE_NAME% || ver > nul
          docker compose -f "%COMPOSE_FILE%" rm -f %SERVICE_NAME% || ver > nul
          docker compose -f "%COMPOSE_FILE%" up -d --no-deps %SERVICE_NAME%

      - name: Show running containers
        run: docker compose -f "%COMPOSE_FILE%" ps

      - name: Prune unused images
        run: docker image prune -f

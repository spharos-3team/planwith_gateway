# AWS deploy ??copy into each service repo as .github/workflows/deploy-aws.yml
# Keeps existing Windows deploy.yml (planwith-server) untouched.
#
# Required repo Variables:
#   AWS_REGION, AWS_ACCOUNT_ID, ECR_REGISTRY, AWS_ROLE_ARN, AWS_EC2_INSTANCE_ID
#
# Placeholders:
#   gateway  compose service name (e.g. planwith-fo-member, discovery)
#   planwith-gateway      ECR repository name (e.g. planwith-fo-member)
#   main        trigger branch (develop or main)

name: Deploy AWS gateway

# Trigger only on push (PR merge already creates a push). Do NOT also listen to
# pull_request closed ??that double-fires and races docker compose recreate on EC2.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aws-deploy-gateway
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY: planwith-gateway
  IMAGE_TAG: latest
  SERVICE_NAME: gateway
  DEPLOY_DIR: /opt/planwith

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy on EC2 via SSM
        env:
          INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          : "${INSTANCE_ID:?AWS_EC2_INSTANCE_ID must be set}"

          # AWS-RunShellScript uses /bin/sh; invoke deploy script with bash.
          # Do not use bash -lc (needs HOME; -c args must be one shell word).
          jq -n --arg svc "${SERVICE_NAME}" '{
            commands: [
              "export HOME=/root",
              "cd /opt/planwith",
              "sed -i \"s/\\r$//\" scripts/deploy-aws.sh || true",
              "chmod +x scripts/deploy-aws.sh",
              ("bash ./scripts/deploy-aws.sh " + $svc)
            ]
          }' > /tmp/ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "planwith deploy ${SERVICE_NAME}" \
            --timeout-seconds 600 \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM CommandId=${COMMAND_ID}"

          for _ in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            echo "SSM Status=${STATUS}"
            case "${STATUS}" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
                  --output json
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
                  --output json
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "SSM command wait timed out"
          exit 1

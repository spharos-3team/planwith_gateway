# AWS deploy — copy into each service repo as .github/workflows/deploy-aws.yml
# Keeps existing Windows deploy.yml (planwith-server) untouched.
#
# Shape (same as a typical build → registry → SSH replace):
#   checkout → OIDC → ECR build/push → appleboy/ssh-action → EC2 deploy-aws.sh
# EC2 still uses docker compose (MSA). Do not docker run a second stack.
#
# Required repo Variables:
#   AWS_REGION, AWS_ACCOUNT_ID, ECR_REGISTRY, AWS_ROLE_ARN, AWS_EC2_HOST
# Required repo Secret:
#   PLANWITH_AWS_SSH_KEY  (PEM; install-aws-workflows.ps1 sets it from the local key)
#
# Placeholders:
#   gateway  compose / ECR / Actions name (same string, e.g. planwith-fo-member)
#   planwith-gateway      must equal gateway
#   main        develop (FO) or main (discovery/gateway)

name: Deploy AWS gateway

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aws-deploy-gateway
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY: planwith-gateway
  IMAGE_TAG: latest
  SERVICE_NAME: gateway

jobs:
  CI-CD:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository
        run: |
          aws ecr describe-repositories --repository-names "${ECR_REPOSITORY}" --region "${AWS_REGION}" \
            || aws ecr create-repository --repository-name "${ECR_REPOSITORY}" --region "${AWS_REGION}" \
                 --image-scanning-configuration scanOnPush=true

      - name: Docker build and push to ECR
        run: |
          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          SERVICE_NAME: ${{ env.SERVICE_NAME }}
        with:
          host: ${{ vars.AWS_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.PLANWITH_AWS_SSH_KEY }}
          command_timeout: 10m
          envs: SERVICE_NAME
          script: |
            set -eu
            cd /opt/planwith
            sudo sed -i 's/\r$//' scripts/deploy-aws.sh scripts/ensure-databases.sh || true
            sudo chmod +x scripts/deploy-aws.sh scripts/ensure-databases.sh 2>/dev/null || true
            sudo bash ./scripts/deploy-aws.sh "$SERVICE_NAME"

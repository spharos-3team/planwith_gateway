spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: fo-user-be-api
              uri: lb://fo-user-be
              predicates:
                - Path=/api/v1/**
              # Client X-Auth-* / X-Gateway-Internal-Token are stripped and re-injected
              # by GatewayContextHeaderFilter (servlet wrapper). Do not RemoveRequestHeader
              # those names here — Gateway MVC would drop the trusted values too.
            - id: fo-user-be-jwks
              uri: lb://fo-user-be
              predicates:
                - Path=/oauth2/jwks
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8080/oauth2/jwks}

server:
  port: ${SERVER_PORT:8000}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}
    instance-id: ${EUREKA_INSTANCE_ID:${spring.application.name}:${server.port}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  gateway:
    internal-token: ${GATEWAY_INTERNAL_TOKEN:local-gateway-internal-token}
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8080}
    audience: ${JWT_AUDIENCE:planwith-api}
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true

logging:
  level:
    root: INFO
    com.planwith.gateway: INFO

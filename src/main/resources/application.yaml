spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - ${CORS_ALLOWED_ORIGIN_LOCALHOST:http://localhost:3000}
                  - ${CORS_ALLOWED_ORIGIN_LOOPBACK:http://127.0.0.1:3000}
                  - ${CORS_ALLOWED_ORIGIN_GW_LOCALHOST:http://localhost:8000}
                  - ${CORS_ALLOWED_ORIGIN_GW_LOOPBACK:http://127.0.0.1:8000}
                  - ${CORS_ALLOWED_ORIGIN_LOCAL:http://localhost:3000}
                  - ${CORS_ALLOWED_ORIGIN_AWS:http://localhost:3000}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                exposed-headers:
                  - Location
                  - Content-Disposition
                allow-credentials: true
                max-age: 3600
          routes:
            # --- planwith-fo-schedule (compose에 등록된 실제 서비스) ---
            - id: planwith-fo-schedule
              uri: lb://planwith-fo-schedule
              predicates:
                - Path=/api/planwith-fo-schedule/**
            - id: planwith-fo-schedule-v1
              uri: lb://planwith-fo-schedule
              predicates:
                - Path=/api/v1/schedules/**,/api/v1/flights/**,/api/v1/flight-locations/**
            - id: planwith-fo-schedule-legacy
              uri: lb://planwith-fo-schedule
              predicates:
                - Path=/schedules/**,/flights/**,/flight-locations/**
            - id: planwith-fo-schedule-docs
              uri: lb://planwith-fo-schedule
              predicates:
                - Path=/docs/planwith-fo-schedule,/docs/planwith-fo-schedule/**
              filters:
                - RewritePath=/docs/planwith-fo-schedule(?<segment>/?.*), /v3/api-docs${segment}

            - id: planwith-fo-member
              uri: lb://planwith-fo-member
              predicates:
                - Path=/api/planwith-fo-member/**

            - id: planwith-fo-member-v1
              uri: lb://planwith-fo-member
              predicates:
                - Path=/api/v1/members/**,/api/v1/auth/**,/api/v1/terms/**,/api/v1/terms

            - id: planwith-fo-member-docs
              uri: lb://planwith-fo-member
              predicates:
                - Path=/docs/planwith-fo-member,/docs/planwith-fo-member/**
              filters:
                - RewritePath=/docs/planwith-fo-member(?<segment>/?.*), /v3/api-docs${segment}

            - id: planwith-fo-grade
              uri: lb://planwith-fo-grade
              predicates:
                - Path=/api/planwith-fo-grade/**

            - id: planwith-fo-grade-docs
              uri: lb://planwith-fo-grade
              predicates:
                - Path=/docs/planwith-fo-grade,/docs/planwith-fo-grade/**
              filters:
                - RewritePath=/docs/planwith-fo-grade(?<segment>/?.*), /v3/api-docs${segment}

            - id: planwith-fo-token
              uri: lb://planwith-fo-token
              predicates:
                - Path=/api/planwith-fo-token/**
            - id: planwith-fo-token-docs
              uri: lb://planwith-fo-token
              predicates:
                - Path=/docs/planwith-fo-token,/docs/planwith-fo-token/**
              filters:
                - RewritePath=/docs/planwith-fo-token(?<segment>/?.*), /v3/api-docs${segment}

            - id: planwith-fo-meeting
              uri: lb://planwith-fo-meeting
              predicates:
                - Path=/api/planwith-fo-meeting/**
            - id: planwith-fo-meeting-docs
              uri: lb://planwith-fo-meeting
              predicates:
                - Path=/docs/planwith-fo-meeting,/docs/planwith-fo-meeting/**
              filters:
                - RewritePath=/docs/planwith-fo-meeting(?<segment>/?.*), /v3/api-docs${segment}

            - id: planwith-fo-membership
              uri: lb://planwith-fo-membership
              predicates:
                - Path=/api/planwith-fo-membership/**
            - id: planwith-fo-membership-docs
              uri: lb://planwith-fo-membership
              predicates:
                - Path=/docs/planwith-fo-membership,/docs/planwith-fo-membership/**
              filters:
                - RewritePath=/docs/planwith-fo-membership(?<segment>/?.*), /v3/api-docs${segment}

            - id: planwith-fo-chat
              uri: lb://planwith-fo-chat
              predicates:
                - Path=/api/planwith-fo-chat/**
            - id: planwith-fo-chat-docs
              uri: lb://planwith-fo-chat
              predicates:
                - Path=/docs/planwith-fo-chat,/docs/planwith-fo-chat/**
              filters:
                - RewritePath=/docs/planwith-fo-chat(?<segment>/?.*), /v3/api-docs${segment}




            # BO 컨트롤러는 /api/admin/** (@RequestMapping). FO처럼 /api/planwith-bo-management 아님.
            - id: planwith-bo-management
              uri: lb://planwith-bo-management
              predicates:
                - Path=/api/admin/**
            - id: planwith-bo-management-docs
              uri: lb://planwith-bo-management
              predicates:
                - Path=/docs/planwith-bo-management,/docs/planwith-bo-management/**
              filters:
                - RewritePath=/docs/planwith-bo-management(?<segment>/?.*), /v3/api-docs${segment}

# Member Service(RS256)와 동일한 issuer/audience. JWK는 Member /oauth2/jwks 에서 조회.
# Docker에서는 JWT_JWK_SET_URI=http://planwith-fo-member:8082/oauth2/jwks 로 주입.
app:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8082}
    audience: ${JWT_AUDIENCE:planwith-api}
    jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8082/oauth2/jwks}

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8000}

eureka:
  client:
    service-url:
      # 실제 서버 IP는 코드에 두지 않음. 로컬 기본값 / Docker·운영은 환경변수로 주입
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    # Gateway Swagger UI에서 서비스별 OpenAPI 선택
    urls:
      - name: planwith-fo-schedule
        url: /docs/planwith-fo-schedule
      - name: planwith-fo-member
        url: /docs/planwith-fo-member
      - name: planwith-fo-grade
        url: /docs/planwith-fo-grade
      - name: planwith-fo-token
        url: /docs/planwith-fo-token
      - name: planwith-fo-meeting
        url: /docs/planwith-fo-meeting
      - name: planwith-bo-management
        url: /docs/planwith-bo-management
      - name: planwith-fo-membership
        url: /docs/planwith-fo-membership
      - name: planwith-fo-chat
        url: /docs/planwith-fo-chat
    urls-primary-name: planwith-fo-schedule
